apiVersion: batch/v1beta1
kind: CronJob
metadata:
  name: sweep
  namespace: shop
spec:
  schedule: "@hourly"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: sweep
            image: registry.example/sweep:0.2.0
---
apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: old-storefront
  namespace: shop
spec:
  rules:
  - http:
      paths:
      - path: /
        backend:
          serviceName: checkout
          servicePort: 80
---
apiVersion: example.com/v1
kind: Widget
metadata:
  name: sprocket
  namespace: shop
spec:
  size: large
