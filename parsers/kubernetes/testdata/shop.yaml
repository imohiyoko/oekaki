apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: shop
spec:
  replicas: 3
  template:
    metadata:
      labels:
        app: checkout
        tier: web
    spec:
      serviceAccountName: checkout
      imagePullSecrets:
      - name: registry
      containers:
      - name: checkout
        image: registry.example/checkout:1.4.0
        envFrom:
        - configMapRef:
            name: checkout-config
        env:
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: checkout-db
              key: password
        - name: FEATURE_FLAGS
          valueFrom:
            configMapKeyRef:
              name: flags
              key: checkout
      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: uploads
      - name: tls
        secret:
          secretName: checkout-tls
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: shop
spec:
  selector:
    app: checkout
  ports:
  - port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: warehouse
  namespace: shop
spec:
  type: ExternalName
  externalName: warehouse.example
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: storefront
  namespace: shop
spec:
  rules:
  - host: shop.example
    http:
      paths:
      - path: /checkout
        pathType: Prefix
        backend:
          service:
            name: checkout
            port:
              number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: checkout
  namespace: shop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: checkout
  minReplicas: 3
  maxReplicas: 30
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-config
  namespace: shop
data:
  LOG_LEVEL: info
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: checkout
  namespace: shop
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads
  namespace: shop
spec:
  accessModes: [ReadWriteOnce]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-reconcile
  namespace: shop
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: reconcile
        spec:
          serviceAccountName: default
          containers:
          - name: reconcile
            image: registry.example/reconcile:1.4.0
            envFrom:
            - secretRef:
                name: checkout-db
